<header class="sticky inset-x-0 top-0 z-50 backdrop-blur border-b">

    <div class="px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
        <div class="header-logo-wrapper"><img src="/assets/logo_p6.png" alt="logo" class="header-logo"
                routerLink="/posts" (click)="mobileMenuIsOpen = false" />
        </div>

        @if (auth.isLoggedIn()) {
        <button (click)="toggleMenu()" class="group relative size-6 grid place-items-center md:hidden"
            aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="mobileMenu" [hidden]="mobileMenuIsOpen">
            <span aria-hidden="true" class="block w-8 h-1 bg-black transition-all origin-center
        group-aria-expanded:translate-y-[7px] group-aria-expanded:rotate-45"></span>
            <span aria-hidden="true" class="block w-8 h-1 bg-black transition-all origin-center
        group-aria-expanded:translate-y-[7px] group-aria-expanded:rotate-45"></span>
            <span aria-hidden="true" class="block w-8 h-1 bg-black transition-all origin-center
        group-aria-expanded:translate-y-[7px] group-aria-expanded:rotate-45"></span>
        </button>

        <div class="hidden md:flex items-center">
            <nav class="flex items-center gap-6">
                <div class="block px-3 py-2  text-[#A40F0F] font-semibold cursor-pointer" (click)="auth.logout()">Se
                    déconnecter</div>
                <a routerLink="/posts" (click)="mobileMenuIsOpen = false" routerLinkActive="text-[#6c5ccf]"
                    [routerLinkActiveOptions]="{ exact: true }">Articles</a>
                <a routerLink="/subjects" (click)="mobileMenuIsOpen = false" routerLinkActive="text-[#6c5ccf]"
                    [routerLinkActiveOptions]="{ exact: true }">Thèmes</a>
            </nav>
            <div class="text-right ms-5 cursor-pointer"> <fa-icon [icon]="faUser" routerLink="/me"
                    (click)="mobileMenuIsOpen = false"
                    class="text-xl rounded-full py-4 px-5 bg-[#D9D9D9] non-active-icon"
                    routerLinkActive="active-icon"></fa-icon>
            </div>
        </div>
        }
    </div>

    @if (auth.isLoggedIn() && mobileMenuIsOpen) {
    <div class="md:hidden fixed inset-0 bg-[#EFEFEF]/70 z-40 h-screen" (click)="toggleMenu()"></div>
    <div
        class="md:hidden absolute top-0 right-0 h-screen z-50 bg-white w-50 border flex flex-col justify-between py-10">
        <nav class="px-4 pb-4 pt-2 space-y-2 flex flex-col items-end">
            <div class="block text-[#A40F0F] font-semibold" (click)="auth.logout()">Se
                déconnecter</div>
            <a routerLink="/posts" (click)="mobileMenuIsOpen = false" routerLinkActive="text-[#6c5ccf]"
                [routerLinkActiveOptions]="{ exact: true }">Articles</a>
            <a routerLink="/subjects" (click)="mobileMenuIsOpen = false" routerLinkActive="text-[#6c5ccf]"
                [routerLinkActiveOptions]="{ exact: true }">Thèmes</a>
        </nav>
        <div class="text-right me-2"> <fa-icon [icon]="faUser" routerLink="/me" (click)="mobileMenuIsOpen = false"
                class="text-xl rounded-full py-4 px-5 bg-[#D9D9D9] non-active-icon"
                routerLinkActive="active-icon"></fa-icon>
        </div>
    </div>
    }
</header>
