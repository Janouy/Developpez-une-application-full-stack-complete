@if (comments$ | async; as comments) {
@if (comments.length > 0) {
<div class="mt-3 m-5">Commentaires</div>

<div class="p-4">
    <div class="flex flex-col items-center">
        <app-comment *ngFor="let comment of comments" [comment]="comment" />
    </div>
</div>

} @else {
<div class=" mt-3 m-5">Aucun commentaire pour le moment.</div>
}

}

<app-comment-form [postId]="postId" (commentAdded)="onCommentAdded()" />
